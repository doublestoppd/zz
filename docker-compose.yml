# Staging or a single-host deployment: one server container behind your TLS-terminating
# proxy. Copy .env.example to .env and fill it in; nothing secret lives in this file.
services:
  game:
    build:
      context: .
      args:
        GAME_VERSION: ${GAME_VERSION:-0.1.0-local}
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    image: zombie:${GAME_VERSION:-0.1.0-local}
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - state:/app/state
      - journals:/app/journals
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  state:
  journals:
